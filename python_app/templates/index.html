<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMA MCTS Assistant</title>
<style>
  :root{--bg:#1a1a2e;--card:#16213e;--accent:#0f3460;--hi:#e94560;--text:#eee;--muted:#aaa;--ok:#4caf50;--warn:#ff9800;--bad:#f44336}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--accent);padding:12px 24px;display:flex;align-items:center;gap:12px}
  header h1{font-size:1.2em;font-weight:600}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
  header .dot.on{background:var(--ok);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto;width:100%}
  .panel{background:var(--card);border-radius:10px;padding:16px}
  .panel h2{font-size:1em;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat-row{display:flex;justify-content:space-between;background:rgba(255,255,255,.05);padding:8px 12px;border-radius:6px}
  .stat-row .label{color:var(--muted)}
  .stat-row .value{font-weight:600}
  .stat-row .value.good{color:var(--ok)}
  .stat-row .value.warn{color:var(--warn)}
  .stat-row .value.bad{color:var(--bad)}
  .cmd-list{display:flex;flex-direction:column;gap:6px}
  .cmd-item{background:rgba(255,255,255,.05);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cmd-item .name{font-weight:600;min-width:80px}
  .cmd-item .detail{color:var(--muted);font-size:.85em;flex:1}
  .cmd-item .fail{font-weight:600;min-width:50px;text-align:right}
  .cmd-item.disabled{opacity:.35}
  .cmd-item.best{border:2px solid var(--ok);background:rgba(76,175,80,.1)}
  .cmd-item.second{border:1px solid var(--warn);background:rgba(255,152,0,.08)}
  .btn{background:var(--hi);color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:1em;font-weight:600}
  .btn:hover{filter:brightness(1.15)}
  .btn:disabled{opacity:.4;cursor:default}
  .ctrl{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .ctrl label{color:var(--muted);font-size:.85em}
  .ctrl input{width:80px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:6px 8px;color:var(--text);font-size:.9em}
  .note{background:rgba(233,69,96,.15);padding:10px;border-radius:6px;margin-bottom:12px;color:var(--hi)}
  .mcts-bar{display:flex;align-items:center;gap:8px;margin:4px 0}
  .mcts-bar .bar{flex:1;height:18px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
  .mcts-bar .bar-fill{height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
  .mcts-bar .bar-fill.alt{background:var(--accent)}
  .mcts-bar .pname{min-width:80px;font-weight:600;font-size:.9em}
  .mcts-bar .pct{min-width:55px;text-align:right;font-size:.85em;color:var(--muted)}
  .mcts-bar .pavg{min-width:50px;text-align:right;font-size:.85em;color:var(--muted)}
  .bond-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .bond-card{text-align:center;padding:8px 4px;background:rgba(255,255,255,.05);border-radius:6px;font-size:.8em}
  .bond-card .bnum{font-size:1.3em;font-weight:700}
  .bond-card .bname{color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bond-card.max{background:rgba(233,69,96,.15)}
  .bond-card.max .bnum{color:var(--hi)}
  .status-bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:4px}
  .status-bar .fill{height:100%;border-radius:4px;transition:width .3s}
  .loading{color:var(--muted);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>UMA MCTS Assistant</h1>
  <span style="flex:1"></span>
  <span id="turnLabel" style="color:var(--muted)">等待連結…</span>
</header>

<div class="main">
  <!-- Left: Game State -->
  <div class="panel" id="statePanel">
    <h2>Game State</h2>
    <div id="stateContent"><div class="loading">等待遊戲連線…</div></div>
  </div>

  <!-- Right: MCTS -->
  <div class="panel">
    <h2>MCTS Recommendation</h2>
    <div class="ctrl">
      <label>Iterations <input id="iterInput" type="number" value="15000" min="100" max="100000"></label>
      <label>C (exploration) <input id="cInput" type="number" value="1.4" step="0.1" min="0.1" max="5"></label>
      <label>Seed <input id="seedInput" type="number" value="" placeholder="random"></label>
      <button class="btn" id="runBtn" onclick="runRecommend()" disabled>Calculate</button>
    </div>
    <div class="ctrl" style="margin-bottom:12px">
      <span style="color:var(--muted);font-size:.85em">Strategy</span>
      <select id="presetSel" onchange="applyPreset()">
        <option value="balance">均衡</option>
        <option value="speed">速度</option>
        <option value="speedstamina">速耐</option>
        <option value="power">力量</option>
        <option value="wiz">賢さ</option>
      </select>
      <label>速<input id="wSpeed" type="number" value="1.0" step="0.1" min="0" max="5" style="width:60px"></label>
      <label>耐<input id="wStamina" type="number" value="1.0" step="0.1" min="0" max="5" style="width:60px"></label>
      <label>力<input id="wPower" type="number" value="1.0" step="0.1" min="0" max="5" style="width:60px"></label>
      <label>根<input id="wGuts" type="number" value="1.0" step="0.1" min="0" max="5" style="width:60px"></label>
      <label>智<input id="wWiz" type="number" value="1.0" step="0.1" min="0" max="5" style="width:60px"></label>
      <label>技能<input id="wSkill" type="number" value="1.0" step="0.1" min="0" max="5" style="width:60px"></label>
    </div>
    <div id="mctsContent"><div class="loading">計算中…</div></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
